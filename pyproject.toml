[project]
name = "grid-analysis"
version = "0.1.0"
description = "Exercise project of the Python workshop: analysing load flow results in the style of PowerFactory scripts"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.1",
    "scipy>=1.14",
]

[dependency-groups]
dev = [
    "bandit>=1.8",
    "cython>=3.0",
    "mypy>=1.13",
    "nuitka>=2.5",
    "pyinstaller>=6.11",
    "pytest>=8",
    "pytest-cov>=6",
    "requests==2.31.0",
    "ruff>=0.8",
    "sphinx>=8",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/grid_analysis"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
# The sample solutions are copies of project files and are not checked.
extend-exclude = ["solutions"]

[tool.ruff.lint.per-file-ignores]
# The fake module deliberately keeps the spelling of the real
# PowerFactory API (GetApplication, GetAttribute, ...).
"src/grid_analysis/powerfactory_fake.py" = ["N802"]
